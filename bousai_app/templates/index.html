{% extends "base.html" %}

{% block content %}
<style>
    .home-content {
        max-width: 1000px;
        margin: 0 auto;
        padding: 34px 24px 64px;
    }

    .home-card {
        margin-bottom: 34px;
        padding: 28px;
        background: #ffffff;
        border: 1px solid #eef2f7;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(40, 77, 128, 0.08);
    }

    .home-card h2 {
        margin: 0 0 20px;
        color: #2d5db3;
        font-size: 1.4rem;
    }

    .map-title::before {
        display: none;
    }

    .heading-icon,
    .weather-icon,
    .refresh-icon,
    .detail-icon {
        display: inline-block;
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        vertical-align: -5px;
    }

    .heading-icon,
    .weather-icon {
        color: #2d5db3;
    }

    .refresh-icon {
        width: 19px;
        height: 19px;
        color: #2f9e50;
        vertical-align: -4px;
    }

    .detail-icon {
        width: 18px;
        height: 18px;
        color: #64748b;
        vertical-align: -4px;
    }

    .status-icon {
        color: #2f9e50;
    }

    .title-with-icon {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #shelterMap {
        height: 365px;
        overflow: hidden;
        border-radius: 12px;
    }

    .weather-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .weather-heading h2 {
        margin-bottom: 0;
    }

    .weather-heading h2,
    .refresh-label {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .refresh-label {
        color: #2f9e50;
        font-weight: 700;
        white-space: nowrap;
    }

    .weather-heading + p {
        display: none;
    }

    #weatherContent {
        margin-top: 20px;
        padding: 20px;
        background: #f8fafc;
        border-radius: 12px;
    }

    #weatherContent p {
        margin: 0 0 10px;
    }

    #weatherContent p:last-child {
        margin-bottom: 0;
    }

    #weatherContent p:nth-child(2) {
        color: #2f9e50;
        font-weight: 700;
    }

    #weatherContent p {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #weatherContent ul {
        margin-top: 0;
    }

    @media (max-width: 600px) {
        .home-content {
            padding: 22px 12px 40px;
        }

        .home-card {
            margin-bottom: 22px;
            padding: 18px;
            border-radius: 12px;
        }

        .weather-heading {
            align-items: flex-start;
            flex-direction: column;
            gap: 8px;
        }

        #shelterMap {
            height: 300px;
        }
    }
</style>

<svg aria-hidden="true" width="0" height="0" style="position: absolute;">
    <symbol id="icon-map-pin" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
    </symbol>
    <symbol id="icon-weather" viewBox="0 0 24 24">
        <path fill="currentColor" d="M7.5 18a4.5 4.5 0 1 1 1.05-8.88A5.5 5.5 0 0 1 19 11.5a3.5 3.5 0 0 1-.5 6.98H7.5Z"/>
        <path fill="currentColor" d="M5 3h2v3H5V3Zm-3 5h3v2H2V8Zm2.1-4.31 1.41-1.4 2.12 2.12-1.41 1.41L4.1 3.69Z"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V8a4 4 0 1 1-3.87 5h-2.1A6 6 0 1 0 17.65 6.35Z"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 10.41 3.3 3.3-1.42 1.42L11 13V6h2Z"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm-1 15-4-4 1.41-1.41L11 14.17l4.59-4.58L17 11Z"/>
    </symbol>
    <symbol id="icon-broadcast" viewBox="0 0 24 24">
        <path fill="currentColor" d="M4 10v4l8 4V6l-8 4Zm9 2h2a3 3 0 0 0 0-4h-2v4Zm3.5-5.5a6 6 0 0 1 0 11l1-1.73a4 4 0 0 0 0-7.54l-1-1.73ZM19 3a10 10 0 0 1 0 18l-1-1.73a8 8 0 0 0 0-14.54L19 3Z"/>
    </symbol>
</svg>

<div class="home-content">
    <!-- 避難所マップ -->
    <section class="home-card" aria-labelledby="shelterMapTitle">
        <h2 class="map-title title-with-icon" id="shelterMapTitle">
            <svg class="heading-icon"><use href="#icon-map-pin"></use></svg>
            <span>避難所マップ</span>
        </h2>
        <div id="shelterMap"></div>
    </section>

<!-- 気象警報・注意報 -->
    <section class="home-card" aria-labelledby="weatherTitle">
        <div class="weather-heading">
            <h2 id="weatherTitle">
                <svg class="weather-icon"><use href="#icon-weather"></use></svg>
                <span>青森市 気象警報・注意報</span>
            </h2>
            <span class="refresh-label">
                <svg class="refresh-icon"><use href="#icon-refresh"></use></svg>
                <span>10分おき自動更新</span>
            </span>
        </div>
        <p>10分おきに自動更新されます。</p>
        <div id="weatherContent">
            <p>読み込み中...</p>
        </div>
    </section>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8246, 140.7400], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p><svg class="detail-icon status-icon"><use href="#icon-check"></use></svg><span>現在、警報・注意報は発表されていません</span></p>';
        }

        weatherContent.innerHTML = `
            <p><svg class="detail-icon"><use href="#icon-map-pin"></use></svg><span>${data.area_name || '青森市'}</span></p>
            ${warningsHtml}
            <p><svg class="detail-icon"><use href="#icon-clock"></use></svg><span>データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></span></p>
            <p><svg class="detail-icon"><use href="#icon-broadcast"></use></svg><span>気象庁発表: ${data.report_time || '不明'}</span></p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
